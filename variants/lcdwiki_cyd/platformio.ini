; ---------------- colour touch UI (examples/companion_radio/ui-cyd) ----------------
; Direct-draw on the panel, no sprite. Same mesh/BLE as the companion_radio_ble envs.

[env:LCDWIKI_28_ST7789_cyd_ble]
