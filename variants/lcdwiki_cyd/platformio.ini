; LCDWIKI CYD boards (classic ESP32, 4 MB flash, no PSRAM) with an Ebyte E22-900M30S.
; Two panels share this variant; board_pins.h picks the LCD/touch wiring from the macro:
;   LCDWIKI_28_ST7789  2.8" ESP32-2432S028R, ST7789, touch on dedicated 25/32/39
;   LCDWIKI_35         3.5" ESP32-32E, ST7796, touch on the shared LCD bus
; Pin maps are the hardware-verified ones from the Meshtastic port of the same boards.

[lcdwiki_cyd_common]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv   ; 1.9 MB app on the 4 MB part
monitor_filters = esp32_exception_decoder
build_flags =
  ${esp32_base.build_flags}
  -I variants/lcdwiki_cyd
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  ; E22 on VSPI, shared with the SD slot (CS 5). NSS/RESET/BUSY/RXEN differ per board.
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23
  -D P_LORA_DIO_1=35
  ; TXEN is jumpered to the module's own DIO2 pad; only RXEN costs an MCU pin.
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  ; E22-900M30S: 20 dBm into the PA gives ~30 dBm out. Do not exceed (docs/faq.md 7.7).
  -D LORA_TX_POWER=20
  ; The app / CLI / prefs work in ANTENNA dBm: cap = 20 + 10 = 30, chip driven 10 lower.
  -D LORA_PA_GAIN_DB=10
  ; US narrow default; the companion app sets the real preset at runtime.
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D PIN_USER_BTN=0          ; BOOT button, active low
  -D PIN_VBAT_READ=34        ; divider ratio unmeasured; ESP32Board assumes 1:1
  -D PIN_BOARD_SDA=-1        ; no I2C: GPIO21 is a backlight / LoRa CS on these boards
  -D PIN_BOARD_SCL=-1
  -D SDCARD_CS=5
  -D DISPLAY_CLASS=CYDDisplay
  -D UI_HAS_TOUCH_BUTTON=1
  -D UI_HEAP_LOG=1
  -D KEEP_DISPLAY_ON_USB=1
  -D AUTO_OFF_MILLIS=30000
  -D ARDUINO_LOOP_STACK_SIZE=16384   ; ui-new envs; the cyd envs override below
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lcdwiki_cyd>
  +<helpers/ui/LGFXDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
; GPS on the Meshtastic pins: module TX -> GPIO3 (UART0 RX, console RX is detached in
; target.cpp), 9600 baud. GPIO16 is UART1's dummy TX pad. BLE envs only: the USB companion
; env needs GPIO3 for the phone link.
gps_build_flags =
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_TX=3
  -D PIN_GPS_RX=16
  -D GPS_BAUD_RATE=9600
  -D ENV_SKIP_GPS_DETECT=1     ; expose the GPS setting even if no NMEA within 5 s of boot
gps_src_filter =
  +<helpers/sensors/*.cpp>
gps_lib_deps =
  stevemarple/MicroNMEA @ ^2.0.6

[lcdwiki_28_st7789]
extends = lcdwiki_cyd_common
build_flags =
  ${lcdwiki_cyd_common.build_flags}
  -D LCDWIKI_28_ST7789
  -D P_LORA_NSS=27
  -D P_LORA_RESET=22
  -D P_LORA_BUSY=17          ; not 34 - that pin is the TP4056 divider on the QDTech 2.8"
  -D SX126X_RXEN=4           ; RGB red; keep RXEN away from the touch pins 25/32/33/36/39
  -D UI_ZOOM=2.5             ; 320x240 -> 128x96 logical, 12 KB sprite
  -D CYD_PANEL_INVERT=1

[lcdwiki_35]
extends = lcdwiki_cyd_common
build_flags =
  ${lcdwiki_cyd_common.build_flags}
  -D LCDWIKI_35
  -D P_LORA_NSS=21           ; JST "SPI peripheral CS"; 27 is the backlight here
  -D P_LORA_RESET=25
  -D P_LORA_BUSY=39          ; input-only is fine for BUSY
  -D SX126X_RXEN=32
  -D UI_ZOOM=3.75            ; 480x320 -> 128x85 logical, 11 KB sprite
  -D CYD_PANEL_INVERT=0   ; this ST7796 reads correct colours NON-inverted; More > Invert colours overrides (NVS)

; ---------------- 2.8" ST7789 ----------------

[env:LCDWIKI_28_ST7789_companion_radio_ble]
extends = lcdwiki_28_st7789
build_flags =
  ${lcdwiki_28_st7789.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
  ${lcdwiki_cyd_common.gps_build_flags}
build_src_filter = ${lcdwiki_28_st7789.build_src_filter}
  +<helpers/esp32/*.cpp>
  ${lcdwiki_cyd_common.gps_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${lcdwiki_28_st7789.lib_deps}
  densaugeo/base64 @ ~1.4.0
  ${lcdwiki_cyd_common.gps_lib_deps}

[env:LCDWIKI_28_ST7789_companion_radio_usb]
extends = lcdwiki_28_st7789
build_flags =
  ${lcdwiki_28_st7789.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D ENABLE_USB_INTERFACE
build_src_filter = ${lcdwiki_28_st7789.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${lcdwiki_28_st7789.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LCDWIKI_28_ST7789_repeater]
extends = lcdwiki_28_st7789
build_flags =
  ${lcdwiki_28_st7789.build_flags}
  -D ADVERT_NAME='"CYD 2.8 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${lcdwiki_28_st7789.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${lcdwiki_28_st7789.lib_deps}
  ${esp32_ota.lib_deps}

