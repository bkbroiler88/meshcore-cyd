; ---------------------------------------------------------------------------
; BKBroiler Mesh V2.1: XIAO nRF52840 + E22-900M30S + ATGM336H GPS + MAX17048
; ---------------------------------------------------------------------------
[Xiao_nrf52_bkmesh]
extends = Xiao_nrf52
; Full flag list, not ${Xiao_nrf52.build_flags}: PlatformIO places every -U after
; the -D defines, so the stock section's -UENV_INCLUDE_GPS (and any -U/-D override
; here) would win over the values below.
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/xiao_nrf52
  -D NRF52_PLATFORM
  -D XIAO_NRF52
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=11
  -D P_LORA_DIO_1=D1
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D SX126X_RXEN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_USER_BTN=PIN_BUTTON1
  -D DISPLAY_CLASS=NullDisplayDriver
  -D BKMESH_V2=1
  ; E22-900M30S: SX1262 driven at 20 dBm into the +10 dB PA. Prefs and the app
  ; use antenna dBm, so the limit becomes 30 (RadioLibWrapper subtracts the gain).
  -D LORA_TX_POWER=20
  -D LORA_PA_GAIN_DB=10
  ; I2C: D6 (P1.11) = SDA, D7 (P1.12) = SCL -> MAX17048 gauge + I2C header
  -D PIN_WIRE_SDA=D6
  -D PIN_WIRE_SCL=D7
  -D BATT_MAX17048=1
  ; GPS on the NFC pads, 9600 baud. MeshCore naming is GPS-side:
  ; PIN_GPS_RX = line INTO the GPS (MCU TX), PIN_GPS_TX = line OUT of it (MCU RX).
  ; D30 = P0.09 NFC1 (MCU TX -> GPS RX), D31 = P0.10 NFC2 (GPS TX -> MCU RX).
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  -D ENV_INCLUDE_GPS=1
  -D PIN_GPS_RX=30
  -D PIN_GPS_TX=31
  -D GPS_BAUD_RATE=9600

